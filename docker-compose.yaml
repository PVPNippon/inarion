version: "3.8"
services:
  api:
    build: ./api
    container_name: api_c
    ports:
      - '4000:4000'
    networks:
      - test
    depends_on:
      - frontend

  frontend:
    build: ./frontend
    container_name: frontend_react
    ports:
      - '5000:80'
    stdin_open: true

  ui:
    build: ./next-ui
    container_name: ui
    ports:
      - '3000:3000'
    # environment:
    #   - PORT=3000      # Specify the custom port 6000
    #   - HOST=0.0.0.0
    stdin_open: true
    networks: 
      - test


networks:
  test:
    driver: bridge
  mynetwork:
    driver: bridge