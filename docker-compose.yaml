version: "3.8"
services:
  api:
    build: ./api
    container_name: api_c
    ports:
      - '4000:4000'
   
  frontend:
    build: ./frontend
    container_name: frontend_react
    ports:
      - '3000:80'
    environment:
      - PORT=5000   # Set the environment variable to use port 5000
    stdin_open: true
    tty: true

