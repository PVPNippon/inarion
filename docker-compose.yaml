version: "3.8"
services:
  api:
    build: ./api
    container_name: api_c
    ports:
      - '4000:4000'
    networks:

      - mynetwork
      - test
    # environment:
    #   - POSTGRES_HOST=192.168.1.7
    #   - POSTGRES_USER=postgres
    #   - POSTGRES_PASSWORD=***REMOVED***

    depends_on:
      - frontend

  frontend:
    build: ./frontend
    container_name: frontend_react
    ports:
      - '3001:80'
    environment:
      - PORT=3001 # Set the environment variable to use port 3001

    stdin_open: true

  ui:
    build: ./next-ui
    container_name: ui
    ports:
      - '3000:3000'
    # environment:
    #   - PORT=3000     
    #   - HOST=0.0.0.0
    stdin_open: true
    networks:
      - test

networks:
  test:
    driver: bridge
  mynetwork:
    driver: bridge
